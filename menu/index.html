<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0916">
<title>Меню</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0C0916;--card:#171228;--card2:#221A3A;--line:#2F2650;--gold:#F5C542;--text:#F7F4FF;--muted:#A79FC4;--bad:#FF5A5F;--ok:#3DDC84}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
 background-image:radial-gradient(120% 50% at 50% -10%,#2E1760 0%,#16102A 45%,#0C0916 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 90px}
header{padding:22px 0 10px;display:flex;gap:12px;align-items:center}
.logo{width:52px;height:52px;border-radius:50%;border:2px solid #7C3AED;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:var(--gold);flex:none}
h1{font-size:22px;font-weight:900;line-height:1.15}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 8px;font-weight:700;font-size:12px;cursor:pointer}
.lang button.on{color:#fff;border-color:#7C3AED}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:24px;height:46px;padding:0 16px;margin:8px 0 10px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 15px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}
.chip.on{background:linear-gradient(135deg,#6D28D9,#A21CAF);border-color:transparent}
.cat{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-weight:900;font-size:18px}
.cat:before{content:'';width:4px;height:18px;border-radius:2px;background:#7C3AED}
.cat span{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:7px;cursor:pointer;position:relative}
.ph{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:1/1;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:34px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-weight:700;font-size:14px;margin:8px 3px 2px;line-height:1.25;min-height:35px}
.gr{color:var(--muted);font-size:12px;margin:0 3px 7px;min-height:15px}
.pill{display:inline-block;background:linear-gradient(135deg,#E0A82E,#FFE08A,#E9B23A);color:#2A1C00;font-weight:800;border-radius:30px;padding:5px 11px;font-size:13px}
.tag{position:absolute;font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:9px}
.left{background:#FF8A00;color:#fff;bottom:7px;right:7px}
.off{position:absolute;inset:0;background:rgba(12,9,22,.62);display:flex;align-items:center;justify-content:center}
.off b{background:var(--bad);color:#fff;font-size:12px;padding:5px 10px;border-radius:10px}
.info{display:flex;gap:10px;margin-top:22px}
.info a{flex:1;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;font-weight:700;text-align:center}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:24px}
.foot a{color:var(--gold);text-decoration:none}
.empty,.err{color:var(--muted);text-align:center;padding:60px 10px;font-size:15px}
.sk{background:linear-gradient(90deg,#171228,#221A3A,#171228);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;aspect-ratio:.78}
@keyframes sk{to{background-position:-200% 0}}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.dlg.on{display:flex}
.sheet{background:#16112A;width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:12px 18px 28px;max-height:92vh;overflow:auto}
.sheet .bar{width:40px;height:4px;border-radius:2px;background:#3a3060;margin:0 auto 12px}
.sheet .big{border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:48px}
.sheet .big img{width:100%;height:100%;object-fit:cover}
.sheet h2{font-size:22px;font-weight:900;margin-top:14px}
.sheet p{color:#d9d3ef;font-size:14px;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">·</div>
    <div><h1 id="rname">&nbsp;</h1><div class="sub" id="raddr">&nbsp;</div></div>
    <div class="lang"><button data-l="ru">RU</button><button data-l="uz">UZ</button><button data-l="en">EN</button></div>
  </header>
  <div class="search"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#7C3AED" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="q" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div id="list"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
  <div class="info" id="info"></div>
  <div class="foot">Smart Sistem · <a href="https://b2bsasagency.com">b2bsasagency.com</a></div>
</div>
<div class="dlg" id="dlg"><div class="sheet" id="sheet"></div></div>
<script>
// Smart Sistem — QR menyu (faqat ko'rish). Ma'lumot: Firestore REST (taomlar ochiq o'qiladi).
const P='restoransmartsystem', K='AIzaSyDV5WgEH9ww2iqrlaN6PnK1TYNSI15g7ZU';
const BASE='https://firestore.googleapis.com/v1/projects/'+P+'/databases/(default)/documents';
const rid=(new URLSearchParams(location.search).get('r')||'').trim();
const L={
 ru:{menu:'Меню',all:'Все',search:'Поиск блюда',left:'Осталось {n} шт.',off:'Закончилось',call:'📞 Позвонить',map:'📍 На карте',empty:'Меню пока пустое',err:'Не удалось загрузить меню. Проверьте интернет и обновите страницу.',nor:'Ссылка неверная: нет кода ресторана.',other:'Другое',items:'блюд'},
 uz:{menu:'Menyu',all:'Hammasi',search:'Taom qidirish',left:'{n} ta qoldi',off:'Tugagan',call:'📞 Qo\'ng\'iroq',map:'📍 Xaritada',empty:'Menyu hozircha bo\'sh',err:'Menyuni yuklab bo\'lmadi. Internetni tekshirib, sahifani yangilang.',nor:'Havola noto\'g\'ri: restoran kodi yo\'q.',other:'Boshqa',items:'ta taom'},
 en:{menu:'Menu',all:'All',search:'Search dishes',left:'Only {n} left',off:'Sold out',call:'📞 Call',map:'📍 Map',empty:'The menu is empty for now',err:'Could not load the menu. Check your connection and refresh.',nor:'Invalid link: no restaurant code.',other:'Other',items:'items'},
};
let lang='ru';try{lang=localStorage.getItem('smlang')||((navigator.language||'').toLowerCase().startsWith('uz')?'uz':'ru')}catch(e){} if(!L[lang]) lang='ru';
let R={}, items=[], cat=null, q='';
const t=k=>L[lang][k];
const val=v=>!v?null:('stringValue'in v)?v.stringValue:('integerValue'in v)?Number(v.integerValue):('doubleValue'in v)?v.doubleValue:('booleanValue'in v)?v.booleanValue:null;
const doc=d=>{const o={id:d.name.split('/').pop()};for(const[k,v]of Object.entries(d.fields||{}))o[k]=val(v);return o};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cur(){const c=R.currency||'';if(c)return c;const p=String(R.phone||'').replace(/[^0-9+]/g,'');
 const m=[['+998','UZS'],['+996','KGS'],['+992','TJS'],['+994','AZN'],['+971','AED'],['+90','TRY'],['+77','KZT'],['+7','RUB']];for(const[a,b]of m)if(p.startsWith(a))return b;return'UZS'}
const SYM={UZS:"so'm",RUB:'₽',KZT:'₸',KGS:'сом',TJS:'сомонӣ',USD:'$',EUR:'€',TRY:'₺',AZN:'₼',AED:'AED'};
function money(v){const c=cur(),s=Math.round(Number(v)||0).toLocaleString('ru-RU').replace(/,/g,' ');return (c==='USD'||c==='EUR')?SYM[c]+' '+s:s+' '+(SYM[c]||c)}
function gramm(x){const v=x.gramm??x.vazn;if(v==null||v==='')return'';if(typeof v==='number')return v>0?v+' г':'';return /^[0-9\/.,\s]+$/.test(v)?v+' г':v}
const bor=x=>x.isAvailable!==false&&(x.qoldiq==null||x.qoldiq>0);
async function load(){
  if(!rid){document.getElementById('list').innerHTML='<div class="err">'+t('nor')+'</div>';return}
  try{
    const [rr,mr]=await Promise.all([
      fetch(BASE+'/restaurants/'+encodeURIComponent(rid)+'?key='+K).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(BASE+':runQuery?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'taomlar'}],where:{fieldFilter:{field:{fieldPath:'restoranId'},op:'EQUAL',value:{stringValue:rid}}},limit:1000}})}).then(r=>{if(!r.ok)throw 0;return r.json()}),
    ]);
    if(rr)R=doc(rr);
    items=mr.filter(x=>x.document).map(x=>doc(x.document)).filter(x=>x.nom&&Number(x.narx)>0)
      .sort((a,b)=>String(a.toifa||'').localeCompare(String(b.toifa||''))||String(a.nom).localeCompare(String(b.nom)));
    render();
  }catch(e){document.getElementById('list').innerHTML='<div class="err">'+t('err')+'</div>'}
}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.getElementById('q').placeholder=t('search');
  document.title=t('menu');
  document.getElementById('rname').textContent=t('menu');
  document.getElementById('logo').textContent='🍽';
  document.getElementById('raddr').textContent=R.address||'';
  const tf=x=>(String(x.toifa||'').trim()||t('other'));
  const cats=[...new Set(items.map(tf))];
  document.getElementById('chips').innerHTML=[null,...cats].map(c=>'<button class="chip'+(cat===c?' on':'')+'" data-c="'+esc(c??'')+'">'+esc(c??t('all'))+'</button>').join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c||null;render()});
  const ql=q.toLowerCase();
  const vis=items.filter(x=>(!cat||tf(x)===cat)&&(!ql||String(x.nom).toLowerCase().includes(ql)));
  if(!items.length){document.getElementById('list').innerHTML='<div class="empty">'+t('empty')+'</div>'}
  else{
    let h='';const groups={};vis.forEach(x=>(groups[tf(x)]=groups[tf(x)]||[]).push(x));
    for(const[c,arr]of Object.entries(groups)){
      h+='<div class="cat">'+esc(c)+'<span>'+arr.length+' '+t('items')+'</span></div><div class="grid">';
      for(const x of arr){
        const ok=bor(x),img=/^https:\/\//.test(x.rasm||'')?'<img loading="lazy" src="'+esc(x.rasm)+'" alt="">':'🍽';
        h+='<div class="item" data-id="'+esc(x.id)+'"><div class="ph">'+img+(ok&&x.qoldiq!=null?'<span class="tag left">'+t('left').replace('{n}',x.qoldiq)+'</span>':'')+(ok?'':'<div class="off"><b>'+t('off')+'</b></div>')+'</div>'
          +'<div class="nm">'+esc(x.nom)+'</div><div class="gr">'+esc(gramm(x))+'</div><span class="pill">'+money(x.narx)+'</span></div>';
      }
      h+='</div>';
    }
    document.getElementById('list').innerHTML=h||'<div class="empty">—</div>';
    document.querySelectorAll('.item').forEach(e=>e.onclick=()=>open(items.find(x=>x.id===e.dataset.id)));
  }
  const tel=String(R.phone||'').replace(/[^0-9+]/g,'');
  document.getElementById('info').innerHTML=(tel?'<a href="tel:'+tel+'">'+t('call')+'</a>':'')+(R.address?'<a target="_blank" rel="noopener" href="https://yandex.ru/maps/?text='+encodeURIComponent(R.address)+'">'+t('map')+'</a>':'');
}
function open(x){if(!x)return;const img=/^https:\/\//.test(x.rasm||'')?'<img src="'+esc(x.rasm)+'" alt="">':'🍽';
  document.getElementById('sheet').innerHTML='<div class="bar"></div><div class="big">'+img+'</div><h2>'+esc(x.nom)+'</h2><div class="sub" style="margin-top:4px">'+esc([gramm(x),x.toifa].filter(Boolean).join(' · '))+'</div>'+(x.tavsif?'<p>'+esc(x.tavsif)+'</p>':'')+'<div style="margin-top:16px"><span class="pill" style="font-size:17px;padding:9px 16px">'+money(x.narx)+'</span>'+(bor(x)?'':' <b style="color:var(--bad);margin-left:8px">'+t('off')+'</b>')+'</div>';
  document.getElementById('dlg').classList.add('on')}
document.getElementById('dlg').onclick=e=>{if(e.target.id==='dlg')e.currentTarget.classList.remove('on')};
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('smlang',lang)}catch(e){}render()});
load(); setInterval(load,60000); // stop-list har daqiqada yangilanadi
</script>
</body>
</html>

name: Kokoro TTS
# Push fetch/tts/jobs/<name>.txt -> fetch/out/tts/<name>.mp3 + .json (word timings) committed back.
on:
  push:
    branches: [fetch-media]
    paths: ['fetch/tts/jobs/**']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Synthesize
        run: |
          TODO=""
          for f in fetch/tts/jobs/*.txt; do n=$(basename "$f" .txt); [ -f "fetch/out/tts/$n.mp3" ] || TODO="$TODO $f"; done
          echo "todo:$TODO"; [ -z "$TODO" ] || python fetch/tts/kokoro_tts.py $TODO
      - name: Commit
        run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git add fetch/out/tts || true
          git commit -m "kokoro tts" || echo nothing
          git pull --rebase -q || true
          git push

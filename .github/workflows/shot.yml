name: Screenshot pages
# Push fetch/shots.txt (lines: "<name> <https-url>") -> phone-size screenshots into fetch/shots/ (after ~25 s load).
on:
  push:
    branches: [fetch-media]
    paths: ['fetch/shots.txt']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p fetch/shots
          cat > s.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => {
            const b = await chromium.launch();
            for (const line of fs.readFileSync('fetch/shots.txt', 'utf8').split('\n')) {
              const [name, url] = line.trim().split(/\s+/); if (!name || !url) continue;
              const p = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
              const logs = [];
              p.on('console', m => logs.push(m.type() + ': ' + m.text()));
              p.on('pageerror', e => logs.push('pageerror: ' + e.message));
              try { await p.goto(url, { waitUntil: 'load', timeout: 60000 }); } catch (e) { logs.push('goto: ' + e.message); }
              await p.waitForTimeout(25000);
              await p.screenshot({ path: 'fetch/shots/' + name + '.png' });
              fs.writeFileSync('fetch/shots/' + name + '.log', logs.slice(0, 80).join('\n'));
              await p.close();
            }
            await b.close();
          })();
          JS
          node s.js
      - name: Commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetch/shots && git commit -m "shots" || echo nothing
          git push

name: Exclusive Vibe render

# ev/jobs/<id>.json push qilinganda: klip tanlaydi (Pexels/Mixkit), original musiqa yaratadi,
# 1080p uzun video + thumbnail render qiladi va GitHub Release "ev-<id>" ga yuklaydi.
on:
  push:
    branches: [exclusive-vibe]
    paths: ["ev/jobs/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ev-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null
          pip install -q numpy scipy pillow
      - name: Render new jobs
        env:
          GH_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p ev/results
          JOBS=$(git diff --name-only HEAD~1 HEAD -- 'ev/jobs/*.json' || true)
          [ -z "$JOBS" ] && JOBS=$(ls -t ev/jobs/*.json | head -1)
          for J in $JOBS; do
            [ -f "$J" ] || continue
            ID=$(python3 -c "import json;print(json.load(open('$J'))['id'])")
            cp "$J" /tmp/job.json
            python3 ev/pick.py /tmp/job.json 2>&1 | tee ev/results/$ID.log
            python3 ev/render.py /tmp/job.json 2>&1 | grep -v '^audio' | tail -200 | tee -a ev/results/$ID.log || { echo FAILED >> ev/results/$ID.log; continue; }
            ls -la out | tee -a ev/results/$ID.log
            cp out/${ID}_clips.txt ev/results/ || true
            cat out/${ID}_clips.txt | sed 's/ //g' >> ev/used.txt
            gh release delete "ev-$ID" -y --cleanup-tag 2>/dev/null || true
            gh release create "ev-$ID" out/$ID.mp4 out/${ID}_thumb.jpg --prerelease --title "Exclusive Vibe $ID" --notes "auto render" --target exclusive-vibe
            echo "RELEASED ev-$ID" >> ev/results/$ID.log
          done
      - name: Save logs
        if: always()
        run: |
          git config user.name "ev-bot"; git config user.email "ev-bot@users.noreply.github.com"
          git add ev/results ev/used.txt 2>/dev/null || true
          git commit -m "ev results [skip ci]" || exit 0
          git pull --rebase -q origin exclusive-vibe || true
          git push -q origin HEAD:exclusive-vibe

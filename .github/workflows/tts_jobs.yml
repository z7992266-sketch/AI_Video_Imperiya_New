name: Free TTS jobs (Kokoro)
# Push fetch/tts/jobs/<id>.txt -> fetch/out/tts/<id>.mp3 (+ .json timings). Voice af_heart by default.
on:
  push:
    branches: [fetch-media]
    paths: ['fetch/tts/jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tts-jobs, cancel-in-progress: false }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: pip install -q kokoro soundfile piper-tts
      - run: python fetch/tts/kokoro_jobs.py
      - name: Commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetch/out/tts
          git commit -m "Kokoro TTS jobs" || echo nothing
          git pull --rebase && git push

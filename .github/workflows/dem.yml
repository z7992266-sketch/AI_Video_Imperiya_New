name: Build DEM data
# Push fetch/dem/build.py -> downloads ETOPO 2022 + Copernicus GLO-90 tiles, saves npz into fetch/out/ouj/.
on:
  push:
    branches: [fetch-media]
    paths: ['fetch/dem/build.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dem:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q rasterio numpy
      - run: python fetch/dem/build.py
      - run: ls -la fetch/out/ouj
      - name: Commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetch/out/ouj
          git commit -m "OUJ DEM data" || echo nothing
          git pull --rebase && git push

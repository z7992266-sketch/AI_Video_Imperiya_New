name: Control Center APK

on:
  push:
    branches: [control-center]
    paths-ignore: ['ci_logs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: control_center
        run: |
          flutter --version | tee ../flutter_version.txt
          flutter create --platforms=android --org uz.b2bsas --project-name control_center .
          rm -rf test
          python3 ../.github/patch_android.py

      - name: Get packages
        working-directory: control_center
        run: flutter pub get

      - name: Analyze
        working-directory: control_center
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.txt

      - name: Stable signing key (har build bir xil kalit — yangilanish eski ilova ustidan o'rnatiladi)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: control-center-signing-v1

      - name: Build APK
        working-directory: control_center
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm 2>&1 | tail -n 120 | tee ../build.txt
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../ControlCenter-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../ControlCenter-old-phones.apk
          ls -la ../*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: control-center-v1.0.${{ github.run_number }}
          name: Control Center v1.0.${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            ControlCenter-arm64.apk
            ControlCenter-old-phones.apk
          body: B2B SAS Control Center — Android APK (internal test build).

      - name: Save CI logs to the branch
        if: always()
        run: |
          mkdir -p ci_logs
          cp -f flutter_version.txt analyze.txt build.txt ci_logs/ 2>/dev/null || true
          echo "run ${{ github.run_number }} status ${{ job.status }} $(date -u)" > ci_logs/last_run.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci_logs
          git commit -m "ci logs run ${{ github.run_number }} [skip ci]" || exit 0
          git push origin HEAD:control-center || true

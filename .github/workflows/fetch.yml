name: Fetch media
# Push fetch/urls.txt (lines: "<name> <https-url>") -> files are downloaded into fetch/out/ and committed.
on:
  push:
    branches: [fetch-media]
    paths: ['fetch/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p fetch/out
          while read -r NAME URL; do
            [ -z "$NAME" ] && continue
            case "$NAME" in *[!A-Za-z0-9._-]*) echo "bad name $NAME"; continue;; esac
            ok=0; for try in 1 2 3; do curl -fsSL -A "Z7RenderBot/1.0 (github.com/z7992266-sketch; media fetch)" --retry 2 --retry-delay 5 --max-filesize 95000000 -o "fetch/out/$NAME" "$URL" && { ok=1; break; }; sleep $((try*8)); done; [ $ok = 1 ] && echo "ok $NAME" || echo "FAIL $NAME"; sleep 1
          done < fetch/urls.txt
          ls -la fetch/out
      - name: Commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetch/out
          git commit -m "fetched media" || echo nothing
          git push

name: uz-tts-test
on:
  push:
    branches: [fetch-media]
    paths: ['fetch/tts/uz/**', '.github/workflows/uz_tts_test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    strategy:
      fail-fast: false
      matrix:
        model: [mms, f5, chatterbox]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: grep -qx '${{ matrix.model }}' fetch/tts/uz/models.txt && echo run=1 >> $GITHUB_OUTPUT || echo run=0 >> $GITHUB_OUTPUT
      - if: steps.chk.outputs.run == '1'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - if: steps.chk.outputs.run == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: steps.chk.outputs.run == '1'
        name: ref clip
        run: mkdir -p uzout && ffmpeg -y -loglevel error -i fetch/out/taqqos_fut_20261121_voice.mp3 -t 8.5 -ac 1 -ar 24000 uzout/ref.wav
      - if: steps.chk.outputs.run == '1'
        name: deps
        run: |
          pip install -q --upgrade pip
          case "${{ matrix.model }}" in
            mms) pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers soundfile numpy ;;
            f5) echo 'torch==2.6.0' > c.txt && echo 'torchaudio==2.6.0' >> c.txt && pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q -c c.txt f5-tts soundfile && (pip uninstall -y -q torchcodec || true) ;;
            chatterbox)
              git clone -q --depth 1 https://github.com/gokhaneraslan/chatterbox-finetuning cbft
              sed -i 's/is_turbo: bool = True/is_turbo: bool = False/' cbft/src/config.py
              pip install -q torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
              pip install -q "setuptools<81" -r cbft/requirements.txt huggingface_hub
              cd cbft && python setup.py && cd ..
              python - <<'PY'
          import os, shutil, glob
          from huggingface_hub import snapshot_download
          d = snapshot_download("UAzimov/Uzbek-tts-chatterbox")
          cfgs = glob.glob(d + "/**/adapter_config.json", recursive=True)
          print("adapter configs:", cfgs)
          src = os.path.dirname(cfgs[0])
          dst = "cbft/chatterbox_output/new_lang_adapter"
          os.makedirs(os.path.dirname(dst), exist_ok=True)
          shutil.copytree(src, dst, dirs_exist_ok=True)
          print(os.listdir(dst))
          PY
              ;;
          esac
      - if: steps.chk.outputs.run == '1'
        name: generate
        run: python fetch/tts/uz/uz_tts_test.py ${{ matrix.model }}
      - if: steps.chk.outputs.run == '1'
        run: ffmpeg -y -loglevel error -i uzout/uz_test_${{ matrix.model }}.wav -af loudnorm=I=-16 -b:a 128k uzout/uz_test_${{ matrix.model }}.mp3
      - if: steps.chk.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with: { name: 'uz-${{ matrix.model }}', path: 'uzout/uz_test_${{ matrix.model }}.mp3' }
  collect:
    needs: tts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: arts, merge-multiple: true }
      - run: |
          mkdir -p fetch/out/tts && cp arts/*.mp3 fetch/out/tts/ || true
          git config user.email noreply@anthropic.com && git config user.name Claude
          git add fetch/out/tts && git commit -m "uz tts test audio" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
